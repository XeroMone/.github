name: Collect Roblox analytics

on:
  schedule:
    # Run a few minutes after the hour to avoid GitHub's top-of-hour congestion.
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: roblox-analytics-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - name: Install dependencies
        run: pip install -r analytics/requirements.txt

      - name: Collect analytics
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: "1gZw4kP2RpjEywWCsEeaT5cDRguMBu8ICHJ_jqyyxkKM"
        run: python analytics/collector.py
